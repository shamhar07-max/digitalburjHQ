name: Android app
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HQ_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.10.2'
      - name: Lint, debug APK, optimized release APK and bundle
        run: gradle -p android --no-daemon :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digitalburj-hq-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
  release:
    # Publishes the installable APKs as a GitHub Release so they can be downloaded straight onto a phone.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: digitalburj-hq-android
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-build-${{ github.run_number }}
        run: |
          find out -type f | sort
          cp "$(find out -type f -name '*release*.apk' | head -n1)" DigitalBurj-HQ.apk
          cp "$(find out -type f -name '*debug*.apk' | head -n1)" DigitalBurj-HQ-debug.apk
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DigitalBurj HQ for Android (build ${{ github.run_number }})" \
            --notes "Install DigitalBurj-HQ.apk on an Android phone (allow installs from this source when asked). DigitalBurj-HQ-debug.apk is a test build that installs alongside it. Release builds are signed with the debug key until a Play Store keystore is configured." \
            DigitalBurj-HQ.apk DigitalBurj-HQ-debug.apk
