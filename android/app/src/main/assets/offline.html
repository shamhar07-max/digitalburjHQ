<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4efe6; color: #14110f;
         font-family: system-ui, sans-serif; text-align: center; }
  main { padding: 28px; max-width: 340px; }
  .mark { width: 72px; height: 72px; border-radius: 20px; background: #14110f; margin: 0 auto 18px; display: grid; place-items: center; }
  .mark i { display: block; width: 8px; height: 28px; background: #e5391f; margin: 0 3px; transform: skewY(-12deg); border-radius: 1px; }
  .row { display: flex; align-items: flex-end; height: 34px; }
  h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 8px; }
  p { margin: 0 0 22px; line-height: 1.5; color: #5c5750; }
  a { display: inline-block; background: #e5391f; color: #fff; text-decoration: none; font-weight: 600; padding: 13px 28px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <div class="mark"><div class="row"><i></i><i style="height:34px"></i></div></div>
  <h1>You're offline</h1>
  <p>Headquarters needs a connection to load your latest work. It will reconnect automatically when the network returns.</p>
  <a href="https://hq.digitalburj.com/">Try again</a>
</main>
</body>
</html>
